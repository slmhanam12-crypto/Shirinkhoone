<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>شیرینی‌خونه</title>
  <meta name="description" content="دستور پخت کیک و شیرینی، قدم‌به‌قدم">
  <meta name="theme-color" content="#A96F52">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="شیرینی‌خونه">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- هدر ثابت بالا: لوگو و نام اپ -->
  <header class="top">
    <img src="./icons/icon-192.png" alt="" width="36" height="36">
    <span class="app-name">شیرینی‌خونه</span>
  </header>

  <!-- محتوای هر صفحه اینجا نشان داده می‌شود -->
  <main id="view" tabindex="-1"></main>

  <!-- نوار پایین: فقط سه گزینه -->
  <nav class="bottom" aria-label="منوی اصلی">
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 10v9.5h13V10"/></svg>
      <span>خانه</span>
    </a>
    <a href="#/favorites" data-nav="favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10Z"/></svg>
      <span>علاقه‌مندی‌ها</span>
    </a>
    <a href="#/about" data-nav="about">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/></svg>
      <span>درباره من</span>
    </a>
  </nav>

  <!-- نوار به‌روزرسانی: وقتی نسخه‌ی جدید آماده شد نشان داده می‌شود -->
  <div id="update-bar" class="update-bar" hidden>
    <span>نسخه‌ی جدید آماده است</span>
    <button type="button" id="update-btn">به‌روزرسانی</button>
  </div>

  <noscript><p style="padding:24px">برای استفاده از شیرینی‌خونه، جاوااسکریپت مرورگر باید روشن باشد.</p></noscript>
  <script src="./app.js"></script>
</body>
</html>
